<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Outing Management</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --primary: #2563eb;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            padding-bottom: 75px;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .login-logo {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: auto;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 700;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .container-main {
            max-width: 1100px;
            margin: auto;
            padding: 20px 15px;
        }

        /* =========================
           EVENT HEADER
        ========================= */

        .event-card {
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );
            color: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .event-card .date {
            opacity: .85;
            font-size: 13px;
        }

        /* =========================
           STAT
        ========================= */

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 17px;
            height: 100%;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .stat-title {
            color: var(--muted);
            font-size: 12px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        /* =========================
           SECTION CARD
        ========================= */

        .section-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            margin-top: 18px;
            overflow: hidden;
        }

        .section-header {
            padding: 15px 17px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h6 {
            margin: 0;
            font-weight: 700;
        }

        /* =========================
           RUNDOWN
        ========================= */

        .rundown-item {
            display: flex;
            gap: 15px;
            padding: 14px 17px;
            border-bottom: 1px solid #f0f0f0;
        }

        .rundown-item:last-child {
            border-bottom: 0;
        }

        .rundown-time {
            width: 50px;
            font-weight: 700;
            font-size: 13px;
            color: var(--primary);
        }

        .rundown-title {
            font-weight: 600;
            font-size: 14px;
        }

        .rundown-location {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        /* =========================
           CASH
        ========================= */

        .money-in {
            color: #16a34a;
        }

        .money-out {
            color: #dc2626;
        }

        .cash-row {
            display: flex;
            justify-content: space-between;
            padding: 13px 17px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        /* =========================
           ANNOUNCEMENT
        ========================= */

        .announcement {
            padding: 15px 17px;
            border-bottom: 1px solid #f0f0f0;
        }

        .announcement-title {
            font-weight: 600;
        }

        .announcement-content {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            z-index: 200;
            display: flex;
            justify-content: center;
        }

        .bottom-nav-inner {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item-app {
            border: 0;
            background: transparent;
            padding: 10px 12px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .nav-item-app i {
            display: block;
            font-size: 20px;
        }

        .nav-item-app.active {
            color: var(--primary);
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 768px) {

            body {
                padding-bottom: 0;
            }

            .bottom-nav {
                display: none;
            }

            .container-main {
                padding-top: 30px;
            }

        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

    </style>
</head>

<body>


<!-- =========================================================
     LOGIN PAGE
========================================================= -->

<div id="loginPage">

    <div class="login-card">

        <div class="login-logo">
            <i class="bi bi-people-fill"></i>
        </div>

        <h4 class="text-center mt-3">
            Outing Management
        </h4>

        <p class="text-center text-muted small">
            Silakan login untuk melanjutkan
        </p>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="email@example.com"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Password"
                    required>

            </div>

            <div
                id="loginError"
                class="alert alert-danger d-none small">
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                <i class="bi bi-box-arrow-in-right"></i>
                Login

            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="app">


    <!-- TOPBAR -->

    <div class="topbar">

        <div class="topbar-inner">

            <div class="brand">

                <span id="topTitle">
                    Outing Management
                </span>

                <small id="topRole">
                    Loading...
                </small>

            </div>

            <div
                class="avatar"
                id="userAvatar">
                A
            </div>

        </div>

    </div>


    <!-- MAIN -->

    <main class="container-main">


        <!-- EVENT -->

        <div class="event-card">

            <div
                class="date"
                id="eventDate">
                Loading...
            </div>

            <h4
                class="mt-1 mb-1"
                id="eventName">
                Loading...
            </h4>

            <div
                class="small"
                id="eventLocation">
                -
            </div>

        </div>


        <!-- STATS -->

        <div class="row g-3">

            <div class="col-6 col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="bi bi-people"></i>
                    </div>

                    <div class="stat-title">
                        Peserta
                    </div>

                    <div
                        class="stat-value"
                        id="totalParticipants">
                        -
                    </div>

                </div>

            </div>


            <div class="col-6 col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="bi bi-wallet2"></i>
                    </div>

                    <div class="stat-title">
                        Saldo Kas
                    </div>

                    <div
                        class="stat-value"
                        id="cashBalance">
                        -
                    </div>

                </div>

            </div>


            <div class="col-12 col-md-4">

                <div class="stat-card">

                    <div class="stat-icon">
                        <i class="bi bi-check2-circle"></i>
                    </div>

                    <div class="stat-title">
                        Progress Pekerjaan
                    </div>

                    <div
                        class="stat-value"
                        id="taskProgress">
                        -
                    </div>

                </div>

            </div>

        </div>


        <!-- RUNDOWN -->

        <div class="section-card">

            <div class="section-header">

                <h6>
                    <i class="bi bi-calendar-event me-1"></i>
                    Rundown
                </h6>

                <button
                    class="btn btn-sm btn-light"
                    onclick="loadRundown()">

                    <i class="bi bi-arrow-clockwise"></i>

                </button>

            </div>

            <div id="rundownList">

                <div class="loading">
                    Loading...
                </div>

            </div>

        </div>


        <!-- CASH -->

        <div class="section-card">

            <div class="section-header">

                <h6>
                    <i class="bi bi-wallet2 me-1"></i>
                    Kas Outing
                </h6>

            </div>

            <div id="cashList">

                <div class="loading">
                    Loading...
                </div>

            </div>

        </div>


        <!-- ANNOUNCEMENT -->

        <div class="section-card">

            <div class="section-header">

                <h6>
                    <i class="bi bi-megaphone me-1"></i>
                    Pengumuman
                </h6>

            </div>

            <div id="announcementList">

                <div class="loading">
                    Loading...
                </div>

            </div>

        </div>


        <!-- MANAGEMENT -->

        <div
            class="section-card"
            id="managementSection"
            style="display:none">

            <div class="section-header">

                <h6>
                    <i class="bi bi-kanban me-1"></i>
                    Pekerjaan Saya
                </h6>

            </div>

            <div class="p-3">

                <div
                    class="row g-2"
                    id="managementButtons">
                </div>

            </div>

        </div>


    </main>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <div class="bottom-nav-inner">

            <button
                class="nav-item-app active">

                <i class="bi bi-house"></i>
                Home

            </button>

            <button
                class="nav-item-app">

                <i class="bi bi-calendar3"></i>
                Rundown

            </button>

            <button
                class="nav-item-app">

                <i class="bi bi-wallet2"></i>
                Kas

            </button>

            <button
                class="nav-item-app"
                onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </button>

        </div>

    </div>

</div>


<script>

    /* ========================================================
       SUPABASE CONFIG
    ======================================================== */

    const SUPABASE_URL =
        "https://ncylyddceptiukzzanlm.supabase.co";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeWx5ZGRjZXB0aXVrenphbmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTk4MDEsImV4cCI6MjEwNTI3NTgwMX0.qO3JYJ5wM8StlptYr0nforp0GaRoQHDLRuCi6aXPyzw";


    const {
        createClient
    } = supabase;

    const db =
        createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* ========================================================
       GLOBAL
    ======================================================== */

    let currentUser = null;
    let currentOuting = null;
    let currentMembership = null;


    /* ========================================================
       INITIALIZE
    ======================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            const {
                data
            } = await db.auth.getSession();

            if (data.session) {

                currentUser =
                    data.session.user;

                await startApp();

            } else {

                showLogin();

            }

        }
    );


    /* ========================================================
       LOGIN
    ======================================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                const errorBox =
                    document.getElementById(
                        "loginError"
                    );

                errorBox.classList.add(
                    "d-none"
                );

                const {
                    data,
                    error
                } = await db.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {

                    errorBox.textContent =
                        error.message;

                    errorBox.classList.remove(
                        "d-none"
                    );

                    return;
                }

                currentUser =
                    data.user;

                await startApp();

            }
        );


    /* ========================================================
       START APP
    ======================================================== */

    async function startApp() {

        document
            .getElementById("loginPage")
            .style.display = "none";

        document
            .getElementById("app")
            .style.display = "block";


        await loadUser();

        await loadOuting();

        if (!currentOuting) {

            alert(
                "Anda belum terdaftar pada outing."
            );

            return;
        }

        await Promise.all([

            loadParticipants(),

            loadRundown(),

            loadCash(),

            loadAnnouncements(),

            loadTasks(),

            setupManagement()

        ]);

    }


    /* ========================================================
       LOAD USER
    ======================================================== */

    async function loadUser() {

        const {
            data,
            error
        } = await db
            .from("users")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .single();

        if (error) {

            console.error(error);

            return;
        }

        const name =
            data.full_name || "User";

        document
            .getElementById("topRole")
            .textContent =
            name;

        document
            .getElementById("userAvatar")
            .textContent =
            name
                .charAt(0)
                .toUpperCase();

    }


    /* ========================================================
       LOAD OUTING
    ======================================================== */

    async function loadOuting() {

        const {
            data,
            error
        } = await db
            .from("outing_users")
            .select(`
                id,
                outing_id,
                role_id,
                section_id,

                roles (
                    code,
                    name
                ),

                sections (
                    code,
                    name
                ),

                outings (
                    id,
                    code,
                    name,
                    description,
                    start_date,
                    end_date,
                    location_name,
                    location_address,
                    status
                )
            `)
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "status",
                "ACTIVE"
            )
            .limit(1)
            .single();

        if (error) {

            console.error(error);

            return;
        }

        currentMembership = data;
        currentOuting = data.outings;

        document
            .getElementById("eventName")
            .textContent =
            currentOuting.name;

        document
            .getElementById("topTitle")
            .textContent =
            currentOuting.name;

        document
            .getElementById("eventLocation")
            .textContent =
            currentOuting.location_name || "-";

        document
            .getElementById("eventDate")
            .textContent =
            formatDateRange(
                currentOuting.start_date,
                currentOuting.end_date
            );

        document
            .getElementById("topRole")
            .textContent =
            data.roles?.name || "Member";

    }


    /* ========================================================
       PARTICIPANTS
    ======================================================== */

    async function loadParticipants() {

        if (!currentOuting)
            return;

        const {
            count,
            error
        } = await db
            .from("participants")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "outing_id",
                currentOuting.id
            )
            .eq(
                "status",
                "ACTIVE"
            );

        if (error) {

            console.error(error);

            return;
        }

        document
            .getElementById(
                "totalParticipants"
            )
            .textContent =
            count ?? 0;

    }


    /* ========================================================
       RUNDOWN
    ======================================================== */

    async function loadRundown() {

        if (!currentOuting)
            return;

        const container =
            document.getElementById(
                "rundownList"
            );

        container.innerHTML =
            `<div class="loading">
                Loading...
            </div>`;

        const today =
            new Date()
                .toISOString()
                .split("T")[0];

        const {
            data,
            error
        } = await db
            .from("rundowns")
            .select(`
                id,
                activity_date,
                start_time,
                end_time,
                activity,
                location,
                description,
                status
            `)
            .eq(
                "outing_id",
                currentOuting.id
            )
            .order(
                "activity_date",
                {
                    ascending: true
                }
            )
            .order(
                "sort_order",
                {
                    ascending: true
                })
            .limit(10);

        if (error) {

            container.innerHTML =
                `<div class="p-3 text-danger">
                    ${escapeHtml(error.message)}
                </div>`;

            return;
        }

        if (!data?.length) {

            container.innerHTML =
                `<div class="loading">
                    Belum ada rundown.
                </div>`;

            return;
        }

        container.innerHTML =
            data.map(item => {

                const time =
                    formatTime(
                        item.start_time
                    );

                return `

                    <div class="rundown-item">

                        <div class="rundown-time">
                            ${time}
                        </div>

                        <div>

                            <div class="rundown-title">
                                ${escapeHtml(
                                    item.activity
                                )}
                            </div>

                            <div class="rundown-location">

                                ${
                                    item.location
                                    ? `<i class="bi bi-geo-alt"></i>
                                       ${escapeHtml(
                                           item.location
                                       )}`
                                    : ""
                                }

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* ========================================================
       CASH
    ======================================================== */

    async function loadCash() {

        if (!currentOuting)
            return;

        const container =
            document.getElementById(
                "cashList"
            );

        const {
            data,
            error
        } = await db
            .from("v_cash_summary")
            .select("*")
            .eq(
                "outing_id",
                currentOuting.id
            );

        if (error) {

            console.error(error);

            container.innerHTML =
                `<div class="p-3 text-danger">
                    ${escapeHtml(error.message)}
                </div>`;

            return;
        }

        if (!data?.length) {

            container.innerHTML =
                `<div class="loading">
                    Belum ada kas.
                </div>`;

            return;
        }

        let totalBalance = 0;

        data.forEach(item => {

            totalBalance +=
                Number(
                    item.current_balance || 0
                );

        });

        document
            .getElementById(
                "cashBalance"
            )
            .textContent =
            formatRupiah(
                totalBalance
            );

        container.innerHTML =
            data.map(item => `

                <div class="cash-row">

                    <div>
                        ${escapeHtml(
                            item.name
                        )}
                    </div>

                    <strong>
                        ${formatRupiah(
                            item.current_balance
                        )}
                    </strong>

                </div>

            `).join("");

    }


    /* ========================================================
       ANNOUNCEMENTS
    ======================================================== */

    async function loadAnnouncements() {

        if (!currentOuting)
            return;

        const container =
            document.getElementById(
                "announcementList"
            );

        const {
            data,
            error
        } = await db
            .from("announcements")
            .select(`
                id,
                title,
                content,
                priority,
                published_at
            `)
            .eq(
                "outing_id",
                currentOuting.id
            )
            .order(
                "published_at",
                {
                    ascending: false
                }
            )
            .limit(5);

        if (error) {

            console.error(error);

            return;
        }

        if (!data?.length) {

            container.innerHTML =
                `<div class="loading">
                    Belum ada pengumuman.
                </div>`;

            return;
        }

        container.innerHTML =
            data.map(item => `

                <div class="announcement">

                    <div class="announcement-title">

                        ${escapeHtml(
                            item.title
                        )}

                        ${
                            item.priority === "URGENT"
                            ? `<span class="badge text-bg-danger ms-1">
                                URGENT
                               </span>`
                            : ""
                        }

                    </div>

                    <div class="announcement-content">

                        ${escapeHtml(
                            item.content
                        )}

                    </div>

                </div>

            `).join("");

    }


    /* ========================================================
       TASK
    ======================================================== */

    async function loadTasks() {

        if (!currentOuting)
            return;

        const {
            data,
            error
        } = await db
            .from("tasks")
            .select(`
                id,
                status
            `)
            .eq(
                "outing_id",
                currentOuting.id
            );

        if (error) {

            console.error(error);

            return;
        }

        const total =
            data?.length || 0;

        const done =
            data?.filter(
                x => x.status === "DONE"
            ).length || 0;

        const progress =
            total
            ? Math.round(
                done / total * 100
            )
            : 0;

        document
            .getElementById(
                "taskProgress"
            )
            .textContent =
            progress + "%";

    }


    /* ========================================================
       MANAGEMENT MENU
    ======================================================== */

    async function setupManagement() {

        const role =
            currentMembership
                ?.roles
                ?.code;

        const section =
            currentMembership
                ?.sections
                ?.code;

        const management =
            document.getElementById(
                "managementSection"
            );

        const buttons =
            document.getElementById(
                "managementButtons"
            );

        let menu = [];

        if (
            role === "ADMIN" ||
            role === "INITIATOR"
        ) {

            menu = [

                {
                    icon: "bi-people",
                    title: "Peserta"
                },

                {
                    icon: "bi-calendar-event",
                    title: "Rundown"
                },

                {
                    icon: "bi-wallet2",
                    title: "Keuangan"
                },

                {
                    icon: "bi-cart",
                    title: "Purchasing"
                },

                {
                    icon: "bi-truck",
                    title: "Logistic"
                },

                {
                    icon: "bi-cup-hot",
                    title: "Konsumsi"
                }

            ];

        } else {

            if (
                section === "KEUANGAN"
            ) {

                menu.push({
                    icon: "bi-wallet2",
                    title: "Keuangan"
                });

            }

            if (
                section === "PURCHASING"
            ) {

                menu.push({
                    icon: "bi-cart",
                    title: "Purchasing"
                });

            }

            if (
                section === "LOGISTIC"
            ) {

                menu.push({
                    icon: "bi-truck",
                    title: "Logistic"
                });

            }

            if (
                section === "KONSUMSI"
            ) {

                menu.push({
                    icon: "bi-cup-hot",
                    title: "Konsumsi"
                });

            }

            if (
                section === "PUBLIC_AREA"
            ) {

                menu.push({
                    icon: "bi-megaphone",
                    title: "Public Area"
                });

            }

        }


        if (!menu.length)
            return;


        management.style.display =
            "block";


        buttons.innerHTML =
            menu.map(item => `

                <div class="col-6 col-md-4">

                    <button
                        class="btn btn-light border w-100 py-3">

                        <i class="bi ${item.icon}
                           d-block fs-4 mb-1"></i>

                        ${item.title}

                    </button>

                </div>

            `).join("");

    }


    /* ========================================================
       LOGOUT
    ======================================================== */

    async function logout() {

        await db.auth.signOut();

        location.reload();

    }


    /* ========================================================
       HELPERS
    ======================================================== */

    function formatRupiah(value) {

        return new Intl.NumberFormat(
            "id-ID",
            {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }
        ).format(
            Number(value || 0)
        );

    }


    function formatDateRange(
        start,
        end
    ) {

        if (!start)
            return "-";

        const s =
            new Date(start)
                .toLocaleDateString(
                    "id-ID",
                    {
                        day: "numeric",
                        month: "short",
                        year: "numeric"
                    }
                );

        if (!end)
            return s;

        const e =
            new Date(end)
                .toLocaleDateString(
                    "id-ID",
                    {
                        day: "numeric",
                        month: "short",
                        year: "numeric"
                    }
                );

        return `${s} - ${e}`;

    }


    function formatTime(time) {

        if (!time)
            return "";

        return time.substring(
            0,
            5
        );

    }


    function escapeHtml(value) {

        if (value === null ||
            value === undefined)
            return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function showLogin() {

        document
            .getElementById("loginPage")
            .style.display = "flex";

        document
            .getElementById("app")
            .style.display = "none";

    }

</script>
